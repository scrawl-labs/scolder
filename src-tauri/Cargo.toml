[package]
name = "wtf-wrong-w-my-eng"
version = "0.3.1"
description = "AI English tutor - real-time speech feedback during online lessons"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "wtf_wrong_w_my_eng_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
dirs = "5"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Audio capture
cpal = "0.15"

# 파일 업로드 오디오 디코딩 (wav/mp3/m4a) - 순수 Rust, 외부 바이너리 불필요
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4", "wav"] }

# Whisper STT (로컬 음성 인식)
whisper-rs = { version = "0.13", features = ["metal"] }

# HTTP client for Ollama API
reqwest = { version = "0.12", features = ["json", "stream"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# WAV encoding (오디오 버퍼 처리)
hound = "3.5"

# Date/time for session naming
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1"

# Home directory path resolution
dirs = "5"
futures-util = "0.3.33"
tauri-plugin-dialog = "2"
tauri-plugin-macos-permissions = "2.3.0"


# macOS 마이크 권한(TCC) 사전 확인 - AVFoundation
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = "0.3"
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }
